services:
  # ── Web App (Django GUI) ────────────────────────────────────────────────────
  - type: web
    name: open-data-ph-etl
    runtime: python
    rootDir: gui
    buildCommand: |
      pip install -r ../requirements.txt
      pip install gunicorn whitenoise
      python manage.py collectstatic --noinput
      python manage.py migrate --run-syncdb
    startCommand: gunicorn gui.wsgi:application --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: open-data-ph-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
    disk:
      name: etl-data
      mountPath: /opt/render/project/src/data
      sizeGB: 5

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
databases:
  - name: open-data-ph-db
    databaseName: opendata_ph
    user: etl_user
    plan: free
