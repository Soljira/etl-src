services:
  db:
    image: postgres:16-alpine
    container_name: etl-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: opendata_ph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d opendata_ph"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: etl-api
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql+pg8000://user:password@db:5432/opendata_ph
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app              # Mount entire project so code changes are live
      - ./data:/app/data
      - ./logs:/app/logs    # Persist pipeline run logs across container restarts

  web:
    container_name: etl-web
    build: .
    # Run migrations first, then start the dev server
    command: >
      sh -c "python gui/manage.py migrate --run-syncdb &&
             python gui/manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+pg8000://user:password@db:5432/opendata_ph
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app              # Mount entire project so code changes are live
      - ./data:/app/data

volumes:
  pgdata:
