services:
  db:
    image: postgres:16-alpine
    container_name: etl-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: opendata_ph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d opendata_ph"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: etl-api
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql+pg8000://user:password@db:5432/opendata_ph
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data  # Mount data dir so extraction persists locally

  web:
    container_name: etl-web
    build: .
    command: python gui/manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+pg8000://user:password@db:5432/opendata_ph
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
